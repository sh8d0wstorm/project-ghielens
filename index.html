<!DOCTYPE html>
<html>
<head>
  <title>My First Map App</title>

  <!-- =========================
    🌍 Leaflet map styling
  ========================== -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <!-- =========================
    🎨 Your custom styles
  ========================== -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
    📂 Hidden Excel import
    (only visible in admin mode)
  ========================== -->
  <input type="file" id="excelFile" style="display:none;" />

  <div id="container">

    <!-- =========================
      📌 LEFT PANEL (UI)
      search + list + admin tools
    ========================== -->
    <div id="sidebar">

   <!-- =========================
     ➕ ADD LOCATION MODAL
   ========================== -->
   <div id="addModal" style="display:none; position:fixed; top:20%; left:50%; transform:translateX(-50%); background:white; padding:20px; border:1px solid #ccc; z-index:9999; width:300px;">

     <h3>Add Location</h3>

     <input id="m_name" placeholder="Naam"><br><br>
     <input id="m_lat" placeholder="Latitude"><br><br>
     <input id="m_ing" placeholder="Longitude"><br><br>
     <input id="m_desc" placeholder="Beschrijving"><br><br>
     <input id="m_img" placeholder="Image URL"><br><br>
     <input id="m_keywords" placeholder="Keywords (komma)"><br><br>

     <button onclick="confirmAdd()">➕</button>
     <button onclick="closeAddModal()">❌</button>

   </div>

   <!-- =========================
     ✏️ EDIT LOCATION MODAL
   ========================== -->
   <div id="editModal" style="display:none;">

     <input id="e_name" placeholder="Name">
     <input id="e_lat" placeholder="Latitude">
     <input id="e_ing" placeholder="Longitude">
     <input id="e_desc" placeholder="Description">
     <input id="e_img" placeholder="Image URL">
     <input id="e_keywords" placeholder="Keywords (comma)">
     
     <button onclick="confirmEdit()">💾</button>
     <button onclick="closeEditModal()">❌</button>
   </div>

   <!-- =========================
     🔎 SEARCH BAR
   ========================== -->
   <input id="search" placeholder="Zoek een plek...">

   <!-- =========================
     🔐 AUTH FORM
   ========================== -->
   <div id="loginForm">
     <input type="password" id="password" placeholder="Wachtwoord" />
     <button id="loginBtn" type="button" onclick="login()">🔓</button>
   </div>
   <button id="logoutBtn" onclick="logout()" style="display:none;">🔒</button>

   <!-- =========================
     ➕ ADD BUTTON (admin only)
   ========================== -->
   <button id="addBtn">➕</button>
  <button id="pickMapBtn">📍</button>
   <!-- =========================
     📍 PLACE LIST + DETAILS
   ========================== -->
   <div id="list"></div>
   <div id="details"></div>

    </div>

    <!-- =========================
      🗺 MAP AREA
    ========================== -->
    <div id="map"></div>

  </div>

  <!-- =========================
    📦 LIBRARIES
  ========================== -->

  <!-- Leaflet map engine -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- Fuse.js fuzzy search -->
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <!-- Your app logic -->
  <script src="javascript.js"></script>

  <!-- ⚠️ Excel library (your link is incomplete in snippet) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

</body>
</html>
