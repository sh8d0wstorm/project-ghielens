<!DOCTYPE html>
<html>
<head>
  <title>My First Map App</title>

  <!-- ===== LEAFLET STYLES ===== -->
  <link rel="stylesheet" href=https://unpkg.com/leaflet@1.9.4/dist/leaflet.css>

  <!-- ===== APP STYLES ===== -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ===== ADMIN EXCEL IMPORT INPUT ===== -->
  <input type="file" id="excelFile" accept=".xlsx" style="display:none;" />

  <div id="container">

    <!-- ===== SIDEBAR: SEARCH, PLACE LIST, AND ADMIN TOOLS ===== -->
    <div id="sidebar">
    <button id="toggle-sidebar"
        type="button"
        aria-label="Menu verbergen"
        aria-expanded="true">
    ◀
</button>

  <!-- ===== ADD LOCATION MODAL ===== -->
  <div id="addModal" style="display:none; position:fixed; top:20%; left:50%; transform:translateX(-50%); background:white; padding:20px; border:1px solid #ccc; z-index:9999; width:300px;">

    <h3>Add Location</h3>

    <input id="m_name" placeholder="Naam"><br><br>
    <input id="m_lat" placeholder="Latitude"><br><br>
    <input id="m_ing" placeholder="Longitude"><br><br>
    <input id="m_desc" placeholder="Beschrijving"><br><br>
    <input id="m_img" placeholder="Image URL"><br><br>
    <input id="m_keywords" placeholder="Keywords (komma)"><br><br>

    <button onclick="confirmAdd()">confirm</button>
    <button onclick="closeAddModal()">close</button>

  </div>

  <!-- ===== EDIT LOCATION MODAL ===== -->
  <div id="editModal" style="display:none;">

    <input id="e_name" placeholder="Name">
    <input id="e_lat" placeholder="Latitude">
    <input id="e_ing" placeholder="Longitude">
    <input id="e_desc" placeholder="Description">
    <input id="e_img" placeholder="Image URL">
    <input id="e_keywords" placeholder="Keywords (comma)">
    
    <button onclick="confirmEdit()">confirm</button>
    <button onclick="closeEditModal()">close</button>
  </div>

  <!-- ===== PLACE SEARCH ===== -->
    <input id="search" placeholder="Zoek een plek...">

  <!-- ===== ADMIN AUTHENTICATION ===== -->
  <div id="loginForm">
    <input type="password" id="password" placeholder="Wachtwoord" />
    <button id="loginBtn" type="button" onclick="login()">log in</button>
  </div>
  <button id="logoutBtn" onclick="logout()" style="display:none;">log out</button>

  <!-- ===== ADMIN LOCATION CONTROLS ===== -->
  <button id="addBtn">add</button>
  <button id="pickMapBtn">pick location</button>
  <!-- ===== PLACE LIST AND DETAILS ===== -->
  <div id="list"></div>
  <div id="details"></div>

    </div>

    <!-- ===== MAP AREA ===== -->
    <button id="locateMe" type="button">
    Show my location
</button>
    <div id="map"></div>

  </div>

  <!-- ===== EXTERNAL LIBRARIES ===== -->

  <!-- ===== LEAFLET MAP ENGINE ===== -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- ===== FUZZY SEARCH ===== -->
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>

  <!-- ===== EXCEL WORKBOOK AND IMAGE EXTRACTION ===== -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="workbook-image-extractor.js"></script>

  <!-- ===== APP LOGIC ===== -->
  <script type="module" src="javascript.js"></script>

</body>
</html>
